<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Domaine de Saint-Geoire</title>
  <style>
    :root { --vert:#3a5a40; --vert2:#2c4632; --ciel:#9fc6e8; --or:#e5a83e; --ink:#eef3ea; }
    html, body { margin:0; height:100%; overflow:hidden; background:var(--ciel);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
    #jeu { position:fixed; inset:0; }
    #jeu canvas { display:block; }

    #chargement { position:fixed; inset:0; z-index:20; display:flex; align-items:center;
      justify-content:center; background:var(--vert); font-size:20px; text-align:center; padding:24px; }

    /* Menu d'accueil */
    #menu { position:fixed; inset:0; z-index:15; display:none; align-items:center; justify-content:center;
      background:linear-gradient(160deg,var(--vert),var(--vert2)); padding:24px; }
    #menu .carte { width:100%; max-width:360px; text-align:center; }
    #menu h1 { font-size:27px; margin:0 0 4px; font-weight:800; letter-spacing:-.01em; }
    #menu .sub { color:#c7d4c2; margin:0 0 22px; font-size:15px; }
    #menu .mode { display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
      margin:9px 0; padding:15px; font-size:17px; font-weight:650; color:var(--ink); cursor:pointer;
      background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); border-radius:13px; }
    #menu .mode:hover:not(:disabled) { background:rgba(255,255,255,.14); border-color:var(--or); }
    #menu .mode:disabled { opacity:.5; cursor:default; }
    #menu .soon { font-size:11px; font-weight:700; background:var(--or); color:#1a1205;
      border-radius:99px; padding:2px 8px; margin-left:2px; }

    /* Invite clic */
    #invite { position:fixed; inset:0; z-index:12; display:none; align-items:center; justify-content:center;
      flex-direction:column; gap:10px; background:rgba(0,0,0,.4); font-size:23px; cursor:pointer; text-align:center; }
    #invite small { font-size:14px; opacity:.85; font-weight:400; max-width:340px; }

    #bandeau { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:10; display:none;
      background:rgba(176,58,46,.92); padding:9px 18px; border-radius:99px; font-weight:600; font-size:15px;
      box-shadow:0 2px 12px rgba(0,0,0,.3); }
    #debug { position:fixed; left:10px; bottom:10px; z-index:10; font-family:ui-monospace,Consolas,monospace;
      font-size:12px; color:#eaf3ea; background:rgba(0,0,0,.35); padding:4px 8px; border-radius:6px; }

    /* Boîte à idées */
    #btnIdee { position:fixed; right:12px; bottom:12px; z-index:11; display:none; width:46px; height:46px;
      font-size:22px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(20,26,21,.7);
      color:#fff; cursor:pointer; }
    #dlgIdee { border:1px solid #2e3830; border-radius:14px; background:#1c231d; color:var(--ink);
      padding:20px; max-width:400px; width:92%; }
    #dlgIdee::backdrop { background:rgba(0,0,0,.5); }
    #dlgIdee h3 { margin:0 0 10px; font-size:17px; }
    #dlgIdee textarea { width:100%; box-sizing:border-box; background:#242d25; color:var(--ink);
      border:1px solid #2e3830; border-radius:8px; padding:9px; font:inherit; font-size:14px; resize:vertical; }
    #dlgIdee .idBtns { display:flex; gap:9px; margin-top:12px; }
    #dlgIdee button { font:inherit; cursor:pointer; border:1px solid #2e3830; background:#242d25; color:var(--ink);
      border-radius:8px; padding:8px 15px; font-size:14px; }
    #dlgIdee button.primary { background:var(--or); border-color:var(--or); color:#1a1205; font-weight:700; }
    #idEtat { margin-top:9px; font-size:13px; color:#c7d4c2; min-height:16px; }
  </style>
</head>
<body>
  <div id="jeu"></div>
  <div id="chargement">Chargement de la carte…</div>

  <div id="menu">
    <div class="carte">
      <h1>Domaine de Saint-Geoire</h1>
      <p class="sub">Balade-toi dans le domaine familial.</p>
      <button class="mode" id="mSolo">🚶 Visite solo</button>
      <button class="mode" id="mMulti">🌍 Visite à plusieurs</button>
      <button class="mode" id="mLoup" disabled>🐺 Loup touche-touche <span class="soon">bientôt</span></button>
    </div>
  </div>

  <div id="invite">Clique pour explorer<small>ZQSD / WASD pour marcher · souris pour regarder · Maj pour courir · Échap pour la pause</small></div>

  <div id="bandeau">⚠ Tu sors des limites du terrain</div>
  <div id="debug"></div>

  <button id="btnIdee" title="Proposer une idée">💡</button>
  <dialog id="dlgIdee">
    <h3>💡 Une idée pour le jeu ?</h3>
    <textarea id="idText" rows="4" placeholder="Ton idée : un objet à ajouter, un truc à corriger, un jeu…"></textarea>
    <div class="idBtns"><button id="idEnvoi" class="primary">Envoyer</button><button id="idFermer">Fermer</button></div>
    <div id="idEtat"></div>
  </dialog>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
